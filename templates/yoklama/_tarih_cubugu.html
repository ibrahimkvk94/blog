<div class="kart mb-3 d-print-none">
  <form method="get" class="yk-tarih-cubugu" data-tarih-formu>
    {% if secili_bolum and not y.kapsam_bolum %}<input type="hidden" name="bolum" value="{{ secili_bolum.pk }}">{% endif %}
    {% if sekme == 'gun' %}
      <a class="btn btn-outline-secondary" href="?tarih={{ onceki|date:'Y-m-d' }}{% if secili_bolum and not y.kapsam_bolum %}&bolum={{ secili_bolum.pk }}{% endif %}" aria-label="Önceki gün" title="Önceki gün"><i class="bi bi-chevron-left"></i></a>
      <input type="date" class="form-control" name="tarih" value="{{ tarih|date:'Y-m-d' }}" aria-label="Tarih" onchange="this.form.submit()">
      <a class="btn btn-outline-secondary" href="?tarih={{ sonraki|date:'Y-m-d' }}{% if secili_bolum and not y.kapsam_bolum %}&bolum={{ secili_bolum.pk }}{% endif %}" aria-label="Sonraki gün" title="Sonraki gün"><i class="bi bi-chevron-right"></i></a>
      <div class="btn-group yk-hizli" role="group" aria-label="Hızlı tarih">
        <a class="btn btn-outline-primary {% if tarih == dun %}active{% endif %}" href="?tarih={{ dun|date:'Y-m-d' }}{% if secili_bolum and not y.kapsam_bolum %}&bolum={{ secili_bolum.pk }}{% endif %}">Dün</a>
        <a class="btn btn-outline-primary {% if tarih == bugun %}active{% endif %}" href="?tarih={{ bugun|date:'Y-m-d' }}{% if secili_bolum and not y.kapsam_bolum %}&bolum={{ secili_bolum.pk }}{% endif %}">Bugün</a>
        <a class="btn btn-outline-primary {% if tarih == yarin %}active{% endif %}" href="?tarih={{ yarin|date:'Y-m-d' }}{% if secili_bolum and not y.kapsam_bolum %}&bolum={{ secili_bolum.pk }}{% endif %}">Yarın</a>
      </div>
    {% else %}
      <label class="small text-secondary" for="ykBas">Başlangıç</label>
      <input type="date" class="form-control" id="ykBas" name="bas" value="{{ bas|date:'Y-m-d' }}" required>
      <label class="small text-secondary" for="ykBit">Bitiş</label>
      <input type="date" class="form-control" id="ykBit" name="bit" value="{{ bit|date:'Y-m-d' }}" required>
      {% if hepsi %}<input type="hidden" name="hepsi" value="1">{% endif %}
      <div class="btn-group" role="group" aria-label="Hızlı aralık">
        <a class="btn btn-outline-primary" href="?bas={{ bugun|date:'Y-m-d' }}&bit={{ hafta|date:'Y-m-d' }}{% if secili_bolum and not y.kapsam_bolum %}&bolum={{ secili_bolum.pk }}{% endif %}">Bu hafta</a>
      </div>
      <button class="btn btn-primary"><i class="bi bi-search me-1"></i>Göster</button>
    {% endif %}
    {% if bolumler %}
      <span class="ayrac d-none d-md-block"></span>
      <select class="form-select" name="bolum" aria-label="Bölüm" onchange="this.form.submit()" data-arama="yok">
        <option value="">Tüm bölümler</option>
        {% for b in bolumler %}<option value="{{ b.pk }}" {% if b == secili_bolum %}selected{% endif %}>{{ b.ad }}</option>{% endfor %}
      </select>
    {% endif %}
  </form>
</div>
