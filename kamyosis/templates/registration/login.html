{% extends "base.html" %}
{% block title %}Giriş{% endblock %}
{% block body %}
{% load static %}
<div class="giris-sayfa">
  <div class="giris-kart">
    <div class="text-center mb-4">
      <img src="{% static 'img/logo_siyah.png' %}" class="giris-logo" alt="KAMYOSİS logosu">
      <h1 class="h3 mt-3 mb-1 fw-bold">{{ sistem_adi }}</h1>
      <p class="text-secondary mb-0">{{ kurum_adi }}</p>
    </div>
    {% if form.errors %}
      <div class="alert alert-danger py-2">Kullanıcı adı veya parola hatalı.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="id_username" name="username" placeholder="Kullanıcı adı" value="{{ form.username.value|default:'' }}" autocomplete="username" autofocus required>
        <label for="id_username">Kullanıcı adı</label>
      </div>
      <div class="form-floating mb-4">
        <input type="password" class="form-control" id="id_password" name="password" placeholder="Parola" autocomplete="current-password" required>
        <label for="id_password">Parola</label>
      </div>
      <button class="btn btn-primary btn-lg w-100">Giriş yap</button>
    </form>
  </div>
  <p class="giris-alt">Yetkisiz erişim girişimleri kayıt altına alınır.</p>
</div>
{% endblock %}
