{% load static %}<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ school }}{% endblock %}</title>
  <style>
    :root { --bg: #f4f5f8; --card: #fff; --text: #1c2230; --muted: #5b6474; --line: #e1e4ea; --brand: #4f46e5; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    a { color: var(--brand); text-decoration: none; }
    .top { background: #141a2a; color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .top a { color: #c7d2fe; }
    .top h1 { font-size: 17px; margin: 0; }
    .top small { color: #a5adbf; display: block; }
    main { max-width: 1200px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    h2 { font-size: 16px; margin: 0 0 10px; }
    .muted { color: var(--muted); }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  <header class="top"><div><h1>{% block heading %}{{ school }}{% endblock %}</h1><small>{{ school.institution }}</small></div>{% block nav %}{% endblock %}</header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
