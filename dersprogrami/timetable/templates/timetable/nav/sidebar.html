{% for g in groups %}
<details class="nav-group" data-nav-group="{{ g.key }}" open{% if g.active %} data-active{% endif %}>
  <summary class="nav-section"><span>{{ g.title }}</span>{% if g.badge %}<span class="nav-badge">{{ g.badge }}</span>{% endif %}<span class="nav-caret" aria-hidden="true"></span></summary>
  <nav class="side-nav">
    {% for i in g.items %}{% if i.visible or i.active %}<a href="{{ i.url }}" class="{% if i.active %}active{% endif %}" title="{{ i.label }}">{% include "timetable/icon.html" with name=i.icon %} <span class="nav-label">{{ i.label }}</span>{% if i.badge %} <span class="nav-badge">{{ i.badge }}</span>{% endif %}</a>{% endif %}{% endfor %}
  </nav>
</details>
{% endfor %}
<script>
/* Grup açık/kapalı durumu tarayıcıda saklanır; açık sayfanın grubu hep açıktır. */
(function () {
  var closed = [];
  try { closed = JSON.parse(localStorage.getItem("nav-closed") || "[]"); } catch (e) {}
  document.querySelectorAll("[data-nav-group]").forEach(function (d) {
    if (closed.indexOf(d.dataset.navGroup) >= 0 && !d.hasAttribute("data-active")) d.open = false;
    d.addEventListener("toggle", function () {
      var list = closed.filter(function (k) { return k !== d.dataset.navGroup; });
      if (!d.open) list.push(d.dataset.navGroup);
      closed = list;
      try { localStorage.setItem("nav-closed", JSON.stringify(list)); } catch (e) {}
    });
  });
})();
</script>
