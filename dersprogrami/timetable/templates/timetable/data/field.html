<div class="form-row{% if field.errors %} has-error{% endif %}{% if field.field.widget.input_type == 'checkbox' and not field.field.widget.allow_multiple_selected %} form-check{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' and not field.field.widget.allow_multiple_selected %}
    <label class="check">{{ field }} <span>{{ field.label }}</span></label>
  {% else %}
    <label class="label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req">*</span>{% endif %}</label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="error">{{ error }}</div>{% endfor %}
</div>
