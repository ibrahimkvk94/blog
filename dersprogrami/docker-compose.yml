# Sunucu kurulumu: PostgreSQL + web + üretim çalışanı + günlük yedek + otomatik HTTPS (Caddy).
# Ayrıntılı adımlar: YAYIN.md. Ayarlar .env dosyasından okunur (.env.example'ı kopyalayın).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: dersprogrami
      POSTGRES_USER: dersprogrami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında olmalı}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dersprogrami"]
      interval: 5s
      retries: 10

  web: &app
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &env
      ROLE: web
      DATABASE_URL: postgres://dersprogrami:${POSTGRES_PASSWORD}@db:5432/dersprogrami
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY .env dosyasında olmalı}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DOMAIN},localhost
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      DJANGO_BEHIND_HTTPS_PROXY: "1"
      TIMETABLE_JOB_BACKEND: worker
      DJANGO_SUPERUSER_USERNAME: ${ADMIN_USERNAME:-}
      DJANGO_SUPERUSER_PASSWORD: ${ADMIN_PASSWORD:-}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-30}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    volumes:
      - backups:/backups

  worker:
    <<: *app
    environment:
      <<: *env
      ROLE: worker
      WORKER_PARALLEL: ${WORKER_PARALLEL:-1}

  backup:
    <<: *app
    environment:
      <<: *env
      ROLE: backup

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN .env dosyasında olmalı}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:
